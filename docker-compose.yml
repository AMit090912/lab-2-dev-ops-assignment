# Multi-container setup: web app + Redis (visit counter)
services:
  web:
    build: .
    image: lab2-app:1.0
    ports:
      - "8000:5000"
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    networks:
      - lab2-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - lab2-net

volumes:
  redis-data:

networks:
  lab2-net:
